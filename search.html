<style>
.srch-wrap{max-width:900px;margin:0 auto;padding:0 20px 60px}
.srch-box{position:relative;margin:0 0 14px}
.srch-box input{width:100%;box-sizing:border-box;font-size:15.5px;padding:14px 46px 14px 42px;
  border:1px solid var(--line);border-radius:10px;background:var(--card);
  box-shadow:var(--shadow);color:var(--ink);outline:none;transition:.18s}
.srch-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(27,79,138,.10)}
.srch-box .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  color:var(--faint);font-size:15px;pointer-events:none}
.srch-box .clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  border:none;background:#eef2f7;color:var(--muted);width:24px;height:24px;
  border-radius:50%;cursor:pointer;font-size:14px;line-height:1;display:none}
.srch-box .clr:hover{background:#e2e8f0;color:var(--ink)}

.srch-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.srch-bar button{font-size:12.4px;padding:6px 13px;border-radius:20px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);transition:.15s;
  font-family:inherit}
.srch-bar button:hover{border-color:var(--brand);color:var(--brand)}
.srch-bar button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.srch-bar button em{font-style:normal;opacity:.65;margin-left:5px;font-size:11.5px}
.srch-count{font-size:12.6px;color:var(--muted);margin-bottom:16px;min-height:18px}
.srch-count b{color:var(--brand)}

.sr-tips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 22px;
  font-size:12.4px;color:var(--muted)}
.sr-tips button{font-size:12px;padding:4px 12px;border-radius:16px;cursor:pointer;
  border:1px dashed var(--line);background:transparent;color:var(--ink-2);font-family:inherit}
.sr-tips button:hover{border-style:solid;border-color:var(--brand);color:var(--brand)}

.res{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:13px 16px;margin-bottom:10px;box-shadow:var(--shadow);transition:.15s}
.res:hover{box-shadow:var(--shadow-h);border-color:#c9dcf2}
.res-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.res-h a.rt{font-size:14.4px;font-weight:700;color:var(--ink);text-decoration:none;line-height:1.6}
.res-h a.rt:hover{color:var(--brand);text-decoration:underline}
.res-cat{flex:none;font-size:10.8px;font-weight:700;padding:2px 7px;border-radius:4px;
  background:#eef3fb;color:var(--brand);border:1px solid #d8e4f5;white-space:nowrap}
.res-cat.duty{background:#fdeced;color:#a3352c;border-color:#f3d3d0}
.res-cat.news{background:#eaf6f3;color:#0f7b6c;border-color:#cfe8e2}
.res-cat.action{background:#fff4e8;color:#c05621;border-color:#f2d9c0}
.res-cat.cal{background:#f3eefb;color:#6d4aa8;border-color:#e2d5f5}
.res-cat.art{background:#fdf0f5;color:#a63d68;border-color:#f6d5e3}
.res-cat.dra{background:#f0f4f8;color:#4a6572;border-color:#dde5ec}
.res-cat.page{background:#f2f5f9;color:var(--muted);border-color:var(--line)}
.res-s{font-size:11.8px;color:var(--faint);margin-bottom:5px;line-height:1.6}
.res-d{font-size:13px;line-height:1.85;color:var(--ink-2)}
.res-d mark,.res-h mark,.res-s mark{background:#fff3bf;color:inherit;border-radius:2px;padding:0 1px}
.res-u{font-size:11.4px;color:var(--faint);margin-top:6px;word-break:break-all}
.res-u a{color:var(--brand);text-decoration:none}
.res-u a:hover{text-decoration:underline}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:15px;color:var(--ink-2);margin-bottom:8px}
.empty p{font-size:13px;line-height:1.9;margin:0}
@media(max-width:720px){
  .srch-wrap{padding:0 14px 40px}
  .srch-box input{font-size:15px;padding:12px 42px 12px 38px}

<script>
var IDX=null, CAT='ALL', RAW='', CATN={};
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function terms(q){ return q.toLowerCase().split(/\s+/).filter(function(x){return x.length>0;}); }
function hl(text,ts){
  var out=esc(text||''); if(!ts.length) return out;
  var safe=ts.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});
  try{ return out.replace(new RegExp('('+safe.join('|')+')','gi'),'<mark>$1</mark>'); }
  catch(e){ return out; }
}
function score(it,ts,strict){
  var hay=((it.t||'')+' '+(it.k||'')+' '+(it.s||'')+' '+(it.d||'')).toLowerCase();
  var tt=(it.t||'').toLowerCase(), s=0, hit=0;
  for(var i=0;i<ts.length;i++){
    var t=ts[i];
    if(tt.indexOf(t)===0) s+=60; else if(tt.indexOf(t)>=0) s+=40;
    if(hay.indexOf(t)>=0){ s+=12; hit++; }
  }
  if(hit<ts.length){
    if(strict||hit===0) return -1;   // 严格模式要求全部命中
    s-=18;                            // 宽松模式：部分命中排在后面
  }
  if(it.c==='duty') s+=8;
  if(it.c==='law') s+=4;
  if(it.c==='page') s-=6;
  return s;
}
function collect(ts,strict){
  var pool=IDX.items.filter(function(it){ return CAT==='ALL'||it.c===CAT; });
  var out=[];
  for(var i=0;i<pool.length;i++){ var sc=score(pool[i],ts,strict); if(sc>=0) out.push([sc,pool[i]]); }
  out.sort(function(a,b){return b[0]-a[0];});
  return out;
}
function render(){
  var box=$('list'), ts=terms(RAW);
  if(!IDX){ box.innerHTML='<div class="empty"><p>索引加载中…</p></div>'; return; }
  var hits=[], loose=false;
  if(!ts.length){
    hits=IDX.items.filter(function(it){ return CAT==='ALL'||it.c===CAT; })
          .slice(0,60).map(function(it){ return it; });
  }else{
    hits=collect(ts,true).map(function(x){return x[1];});
    // 多词严格匹配结果过少 → 放宽为部分匹配（标注来源）
    if(ts.length>1 && hits.length<3){
      hits=collect(ts,false).map(function(x){return x[1];});
      loose=true;
    }
    hits=hits.slice(0,120);
  }
  $('cnt').innerHTML = ts.length
    ? '匹配 <b>'+hits.length+'</b> 条'+(hits.length>=120?'（显示前 120 条，可继续细化关键词）':'')
      + (loose?'　<i style="color:#c05621">未找到同时包含全部关键词的结果，已放宽为部分匹配</i>':'')
    : '共 <b>'+hits.length+'</b> 条'+(hits.length>=60?'（显示前 60 条）':'');
  if(!hits.length){
    box.innerHTML='<div class="empty"><div class="big">没有匹配「'+esc(RAW)+'」的内容</div>'+
      '<p>试试更短的关键词，或改用「摇一摇」「划线价」「分装称重」「算法备案」等具体场景词。</p></div>';
    return;
  }
  box.innerHTML=hits.map(function(it){
    var ext=/^https?:/.test(it.u||'');
    return '<div class="res">'+
      '<div class="res-h"><span class="res-cat '+it.c+'">'+(CATN[it.c]||it.c)+'</span>'+
      '<a class="rt" href="'+esc(it.u)+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+hl(it.t,ts)+'</a></div>'+
      (it.s?'<div class="res-s">'+hl(it.s,ts)+'</div>':'')+
      (it.d?'<div class="res-d">'+hl(it.d,ts)+'</div>':'')+
      '<div class="res-u">'+(ext?'🔗 ':'')+'<a href="'+esc(it.u)+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+esc(it.u)+'</a></div>'+
      '</div>';
  }).join('');
}
fetch('assets/search-index.json').then(function(r){return r.json();}).then(function(d){
  IDX=d;
  (d.cats||[]).forEach(function(c){ CATN[c[0]]=c[1]; });
  var counts={}; d.items.forEach(function(i){ counts[i.c]=(counts[i.c]||0)+1; });
  var html='<button data-c="ALL" class="on">全部<em>'+d.count+'</em></button>';
  (d.cats||[]).forEach(function(c){
    if(!counts[c[0]]) return;
    html+='<button data-c="'+c[0]+'">'+c[1]+'<em>'+counts[c[0]]+'</em></button>';
  });
  var bar=$('bar'); bar.innerHTML=html;
  bar.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    [].forEach.call(bar.querySelectorAll('button'),function(x){x.classList.remove('on');});
    b.classList.add('on'); CAT=b.getAttribute('data-c'); render();
  });
  $('tips').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    $('q').value=b.getAttribute('data-q'); RAW=$('q').value;
    $('clr').style.display='block'; render(); $('q').focus();
  });
  var inp=$('q'), t=null;
  inp.addEventListener('input',function(){
    RAW=inp.value.trim();
    $('clr').style.display=RAW?'block':'none';
    clearTimeout(t); t=setTimeout(function(){
      var u=new URL(location.href);
      if(RAW) u.searchParams.set('q',RAW); else u.searchParams.delete('q');
      history.replaceState(null,'',u); render();
    },120);
  });
  $('clr').addEventListener('click',function(){
    inp.value=''; RAW=''; $('clr').style.display='none'; inp.focus();
    var u=new URL(location.href); u.searchParams.delete('q');
    history.replaceState(null,'',u); render();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==inp){ e.preventDefault(); inp.focus(); }
    if(e.key==='Escape'&&document.activeElement===inp){ inp.blur(); }
  });
  var q0=new URLSearchParams(location.search).get('q')||'';
  if(q0){ inp.value=q0; RAW=q0; $('clr').style.display='block'; }
  render();
}).catch(function(){
  $('list').innerHTML='<div class="empty"><div class="big">索引加载失败</div>'+
    '<p>请检查网络后刷新页面重试。</p></div>';
});
</script>
